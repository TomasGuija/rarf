[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rarf"
version = "0.1.0"
description = "Task-agnostic Region-Aware Rectified Flows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "jsonargparse[signatures]>=4.27.7",
    "lightning==2.5.5",
    "numpy",
    "PyYAML",
    "torch",
    "torchdiffeq==0.2.5",
]

[project.optional-dependencies]
brats = [
    "inpainting==0.0.12",
    "monai>=1.3",
    "nibabel==5.3.2",
    "scipy==1.15.3",
    "torchmetrics==1.8.2",
    "tqdm",
]
images = [
    "datasets>=2.19",
    "Pillow>=10",
]
demo = [
    "gradio==6.9.0",
    "Pillow>=10",
]
all = [
    "datasets>=2.19",
    "gradio==6.9.0",
    "inpainting==0.0.12",
    "monai>=1.3",
    "nibabel==5.3.2",
    "Pillow>=10",
    "scipy==1.15.3",
    "torchmetrics==1.8.2",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["rarf*", "brats*"]
